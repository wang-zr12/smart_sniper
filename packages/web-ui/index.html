<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Smart Sniper</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f7f2;
        --panel: #ffffff;
        --line: #d8d9d2;
        --text: #20231f;
        --muted: #696f65;
        --accent: #1f7a6d;
        --warn: #b66b00;
        --danger: #b42318;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      header {
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        border-bottom: 1px solid var(--line);
        background: #fbfbf7;
      }
      h1 {
        font-size: 18px;
        margin: 0;
        font-weight: 650;
      }
      main {
        display: grid;
        grid-template-columns: 280px 1fr;
        min-height: calc(100vh - 56px);
      }
      nav {
        border-right: 1px solid var(--line);
        padding: 16px;
        background: #fdfdf9;
      }
      button {
        min-height: 36px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: var(--text);
        padding: 0 12px;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        color: white;
        border-color: var(--accent);
      }
      .tabs {
        display: grid;
        gap: 8px;
      }
      .tabs button {
        text-align: left;
        width: 100%;
      }
      .content {
        padding: 20px;
        display: grid;
        gap: 16px;
        align-content: start;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(160px, 1fr));
        gap: 12px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
      }
      .metric {
        font-size: 28px;
        font-weight: 700;
      }
      .muted {
        color: var(--muted);
        font-size: 13px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        border: 1px solid var(--line);
      }
      th, td {
        padding: 10px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        font-size: 14px;
      }
      th {
        background: #f3f4ef;
        color: var(--muted);
        font-weight: 600;
      }
      @media (max-width: 820px) {
        main { grid-template-columns: 1fr; }
        nav { border-right: 0; border-bottom: 1px solid var(--line); }
        .grid { grid-template-columns: 1fr 1fr; }
      }
      @media (max-width: 520px) {
        .grid { grid-template-columns: 1fr; }
        header { align-items: flex-start; height: auto; padding: 12px 16px; gap: 8px; flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Smart Sniper</h1>
      <span class="muted" id="health">Checking...</span>
    </header>
    <main>
      <nav>
        <div class="tabs">
          <button data-view="overview">Overview</button>
          <button data-view="sniper1">Sniper1 Auctions</button>
          <button data-view="sniper2">Sniper2 Orders</button>
          <button data-view="sniper3">Sniper3 Restocks</button>
        </div>
      </nav>
      <section class="content" id="app"></section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
